[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aftershock-mvp"
version = "0.1.0"
description = "Data incident response from DataHub lineage to compensating actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "acryl-datahub==1.6.0.17",
  "fastapi>=0.111,<1",
  "fastmcp==3.4.5",
  "httpx>=0.28,<1",
  "mcp-server-datahub==0.6.0",
  "rich>=13.7,<14",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_datahub: opt-in contract tests against a real seeded DataHub instance through MCP",
]
filterwarnings = [
  "ignore:The new datahub SDK .*:datahub.errors.ExperimentalWarning",
]
